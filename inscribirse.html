<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscríbete | EmprenderMujer</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body class="pagina-formulario">

    <div class="formulario-contenedor">

        <div class="formulario">

            <p class="etiqueta">MUJERESQUELIDERANELDESARROLLO</p>

            <h1>Únete a nuestra comunidad</h1>

            <p class="formulario-descripcion">
                Crea tu cuenta y comienza tu camino hacia la autonomía financiera.
            </p>


            <form>

                <label for="nombre">Nombre completo</label>

                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre"
                    placeholder="Escribe tu nombre"
                >


                <label for="correo">Correo electrónico</label>

                <input 
                    type="email" 
                    id="correo" 
                    name="correo"
                    placeholder="Escribe tu correo"
                >


                <label for="telefono">Número de teléfono</label>

                <input 
                    type="tel" 
                    id="telefono" 
                    name="telefono"
                    placeholder="Escribe tu número"
                >


                <label for="contrasena">Contraseña</label>

                <input 
                    type="password" 
                    id="contrasena" 
                    name="contrasena"
                    placeholder="Crea una contraseña"
                >


                <button type="submit">
                    Crear mi cuenta
                </button>

            </form>


            <p class="formulario-enlace">
                ¿Ya tienes una cuenta?
                <a href="iniciar-sesion.html">Inicia sesión</a>
            </p>


            <a href="index.html" class="volver">
                ← Volver al inicio
            </a>

        </div>

    </div>

</body>

</html>
