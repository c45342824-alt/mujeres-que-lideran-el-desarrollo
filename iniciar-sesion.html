<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | EmprenderMujer</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body class="pagina-formulario">

    <div class="formulario-contenedor">

        <div class="formulario">

            <p class="etiqueta">MUJERESQUELIDERANELDESARROLLO</p>

            <h1>Bienvenida de nuevo</h1>

            <p class="formulario-descripcion">
                Ingresa a tu cuenta para continuar con tu emprendimiento.
            </p>


            <form id="formulario-login">

                <label for="correo">Correo electrónico</label>

                <input 
                    type="email" 
                    id="correo" 
                    name="correo" 
                    placeholder="Escribe tu correo"
                >


                <label for="contrasena">Contraseña</label>

                <input 
                    type="password" 
                    id="contrasena" 
                    name="contrasena" 
                    placeholder="Escribe tu contraseña"
                >


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <p class="formulario-enlace">

                ¿Aún no tienes una cuenta?

                <a href="inscribirse.html">
                    Inscríbete
                </a>

            </p>


            <a href="index.html" class="volver">
                ← Volver al inicio
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
